<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK Mini Editor - Responsivo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/file-saver/2.0.5/FileSaver.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text2: #8b949e;
      --accent: #1f6feb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-left i {
      font-size: 1.25rem;
      color: #58a6ff;
    }

    .header-left h1 {
      font-size: 1rem;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .input-proj {
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text);
      font-size: 0.875rem;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--accent);
      border: none;
      border-radius: 0.375rem;
      color: white;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #388bfd;
    }

    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      border-radius: 0.375rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    /* MAIN CONTAINER */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 1px;
      background: var(--border);
    }

    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: var(--bg2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
      transition: width 0.3s;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 0.875rem;
      font-weight: 600;
    }

    .filetree {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    /* TREE ITEMS */
    .tree-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
      border-left: 2px solid transparent;
    }

    .tree-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .tree-item.active {
      background: rgba(31, 111, 235, 0.1);
      border-left-color: var(--accent);
      color: #58a6ff;
    }

    .tree-toggle {
      width: 1.25rem;
      height: 1.25rem;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      padding: 0;
    }

    .tree-icon-folder {
      color: #d4a574;
      font-size: 0.875rem;
    }

    .tree-icon-file {
      font-size: 0.75rem;
    }

    .tree-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.875rem;
    }

    /* FILE COLORS */
    .icon-html {
      color: #e34c26;
    }

    .icon-css {
      color: #264de4;
    }

    .icon-js {
      color: #f7df1e;
    }

    .icon-json {
      color: #ffd700;
    }

    .icon-md {
      color: #083fa1;
    }

    .icon-image {
      color: #00ff00;
    }

    .icon-py {
      color: #3776ab;
    }

    /* EDITOR AREA */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem 0.375rem 0 0;
      cursor: pointer;
      font-size: 0.875rem;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .tab-close {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 0;
      font-size: 0.75rem;
      opacity: 0.7;
    }

    /* CODE EDITOR */
    .editor-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: column;
    }

    .code-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-editor {
      flex: 1;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      border: none;
      outline: none;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      resize: none;
      tab-size: 2;
    }

    /* PREVIEW SECTION */
    .preview-section {
      height: 300px;
      background: white;
      border-top: 2px solid var(--accent);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.3s;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      font-size: 0.875rem;
      font-weight: 600;
      color: #24292f;
    }

    .preview-controls {
      display: flex;
      gap: 0.5rem;
    }

    .preview-controls button {
      padding: 0.25rem 0.5rem;
      background: #e1e4e8;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.2s;
    }

    .preview-controls button:hover {
      background: #d1d5da;
    }

    .preview-content {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }

    /* MOBILE RESPONSIVO */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-right {
        margin-left: 0;
        width: 100%;
      }

      .main {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 150px;
      }

      .sidebar.collapsed {
        height: 40px;
      }

      .sidebar.collapsed .filetree {
        display: none;
      }

      .preview-section {
        height: 200px;
      }
    }

    @media (max-width: 480px) {
      .header-left h1 {
        display: none;
      }

      .input-proj {
        display: none;
      }

      .btn {
        padding: 0.5rem;
        font-size: 0.75rem;
      }

      .sidebar {
        height: 120px;
      }

      .preview-section {
        height: 150px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <i class="fas fa-code"></i>
        <h1>SK Mini Editor</h1>
      </div>
      <div class="header-right">
        <input type="text" id="projectName" class="input-proj" placeholder="Nome do projeto" value="Meu Projeto">
        <button id="importBtn" class="btn" title="Importar arquivo">
          <i class="fas fa-upload"></i> Importar
        </button>
        <button id="exportBtn" class="btn" title="Exportar como ZIP">
          <i class="fas fa-download"></i> Exportar
        </button>
      </div>
    </header>

    <!-- MAIN -->
    <div class="main">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>Arquivos</h2>
          <button id="newFileBtn" class="btn-icon" title="Novo arquivo">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div id="fileTree" class="filetree"></div>
      </aside>

      <!-- EDITOR -->
      <main class="editor-area">
        <div class="tabs" id="editorTabs"></div>
        <div class="editor-container">
          <div class="code-section">
            <textarea id="codeEditor" class="code-editor" spellcheck="false" placeholder="Selecione um arquivo..."></textarea>
          </div>
          <div class="preview-section" id="previewSection">
            <div class="preview-header">
              <span>Preview</span>
              <div class="preview-controls">
                <button onclick="resizePreview(50)">+</button>
                <button onclick="resizePreview(-50)">−</button>
              </div>
            </div>
            <div class="preview-content">
              <iframe id="previewFrame" class="preview-frame"></iframe>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <input type="file" id="importInput" accept=".zip,.txt,.html,.css,.js,.json,.md,.py" style="display: none;">

  <script>
    // ═══════════════════════════════════════════════════════════════
    // MÓDULO 1: VIRTUAL FILE SYSTEM
    // ═══════════════════════════════════════════════════════════════

    class VFS {
      constructor() {
        this.files = {};
      }

      addFile(path, content) {
        path = this.normalizePath(path);
        this.files[path] = {
          name: path.split('/').pop(),
          path,
          content: String(content),
          type: this.getFileType(path)
        };
        return true;
      }

      normalizePath(path) {
        path = path.replace(/\/+/g, '/');
        if (!path.startsWith('/')) path = '/' + path;
        return path;
      }

      getFileType(filename) {
        const ext = filename.split('.').pop()?.toLowerCase() || '';
        const types = {
          'html': 'html', 'css': 'css', 'js': 'javascript',
          'json': 'json', 'md': 'markdown', 'py': 'python',
          'txt': 'text', 'jpg': 'image', 'png': 'image'
        };
        return types[ext] || 'file';
      }

      getFile(path) {
        path = this.normalizePath(path);
        return this.files[path] || null;
      }

      updateContent(path, content) {
        path = this.normalizePath(path);
        if (this.files[path]) {
          this.files[path].content = String(content);
          return true;
        }
        return false;
      }

      deleteFile(path) {
        path = this.normalizePath(path);
        delete this.files[path];
      }

      getAllFiles() {
        return Object.values(this.files);
      }

      getTree() {
        const tree = { name: 'root', path: '/', children: [] };
        const paths = Object.keys(this.files).sort();

        paths.forEach(filePath => {
          const parts = filePath.split('/').filter(Boolean);
          let current = tree;

          parts.forEach((part, i) => {
            if (i === parts.length - 1) {
              const file = this.files[filePath];
              current.children.push({
                name: file.name,
                path: filePath,
                type: 'file',
                fileType: file.type
              });
            } else {
              let folder = current.children.find(c => c.name === part && c.type === 'folder');
              if (!folder) {
                folder = { name: part, path: '/' + parts.slice(0, i + 1).join('/'), type: 'folder', children: [] };
                current.children.push(folder);
              }
              current = folder;
            }
          });
        });

        return tree;
      }

      async exportZip(projectName) {
        const zip = new JSZip();
        for (const [path, file] of Object.entries(this.files)) {
          const cleanPath = path.startsWith('/') ? path.slice(1) : path;
          zip.file(cleanPath, file.content);
        }
        const blob = await zip.generateAsync({ type: 'blob' });
        saveAs(blob, `${projectName}.zip`);
      }
    }

    const vfs = new VFS();

    // ═══════════════════════════════════════════════════════════════
    // MÓDULO 2: FILE TREE RENDERER
    // ═══════════════════════════════════════════════════════════════

    class FileTreeRenderer {
      constructor(containerId, vfs) {
        this.container = document.getElementById(containerId);
        this.vfs = vfs;
        this.expanded = new Set(['/']);
        this.onSelect = () => {};
      }

      render() {
        const tree = this.vfs.getTree();
        this.container.innerHTML = this.renderNode(tree);
        this.attachListeners();
      }

      renderNode(node) {
        if (node.type === 'folder') {
          const expanded = this.expanded.has(node.path);
          const icon = expanded ? 'chevron-down' : 'chevron-right';
          const folderIcon = expanded ? 'folder-open' : 'folder';

          return `
            <div>
              <div class="tree-item" data-path="${node.path}">
                <button class="tree-toggle" data-path="${node.path}">
                  <i class="fas fa-${icon}"></i>
                </button>
                <i class="fas fa-${folderIcon} tree-icon-folder"></i>
                <span class="tree-name">${node.name}</span>
              </div>
              ${expanded ? `<div style="padding-left: 1rem;">${node.children?.map(c => this.renderNode(c)).join('') || ''}</div>` : ''}
            </div>
          `;
        } else {
          const colorClass = this.getColorClass(node.fileType);
          const icon = this.getIcon(node.fileType);

          return `
            <div class="tree-item" data-path="${node.path}" data-type="file">
              <div style="width: 1.25rem;"></div>
              <i class="fas fa-${icon} tree-icon-file ${colorClass}"></i>
              <span class="tree-name">${node.name}</span>
            </div>
          `;
        }
      }

      getColorClass(type) {
        const colors = {
          'html': 'icon-html', 'css': 'icon-css', 'javascript': 'icon-js',
          'json': 'icon-json', 'markdown': 'icon-md', 'image': 'icon-image',
          'python': 'icon-py'
        };
        return colors[type] || '';
      }

      getIcon(type) {
        const icons = {
          'html': 'file-code', 'css': 'file-code', 'javascript': 'file-code',
          'json': 'file-code', 'markdown': 'file-alt', 'image': 'image',
          'python': 'file-code'
        };
        return icons[type] || 'file';
      }

      attachListeners() {
        this.container.querySelectorAll('.tree-toggle').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const path = btn.dataset.path;
            if (this.expanded.has(path)) {
              this.expanded.delete(path);
            } else {
              this.expanded.add(path);
            }
            this.render();
          });
        });

        this.container.querySelectorAll('[data-type="file"]').forEach(item => {
          item.addEventListener('click', () => {
            editor.selectFile(item.dataset.path);
          });
        });
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // MÓDULO 3: EDITOR PRINCIPAL
    // ═══════════════════════════════════════════════════════════════

    class Editor {
      constructor() {
        this.currentFile = null;
        this.tabs = new Set();
        this.previewTimeout = null;

        this.codeEditor = document.getElementById('codeEditor');
        this.previewFrame = document.getElementById('previewFrame');
        this.editorTabs = document.getElementById('editorTabs');
        this.importBtn = document.getElementById('importBtn');
        this.exportBtn = document.getElementById('exportBtn');
        this.importInput = document.getElementById('importInput');
        this.projectNameInput = document.getElementById('projectName');
        this.newFileBtn = document.getElementById('newFileBtn');

        this.fileTree = new FileTreeRenderer('fileTree', vfs);
        this.fileTree.onSelect = (path) => this.selectFile(path);

        this.setupListeners();
        this.addExamples();
        this.fileTree.render();
      }

      setupListeners() {
        this.importBtn.addEventListener('click', () => this.importInput.click());
        this.exportBtn.addEventListener('click', () => this.exportProject());
        this.importInput.addEventListener('change', (e) => this.handleImport(e));
        this.codeEditor.addEventListener('input', () => this.updateFile());
        this.newFileBtn.addEventListener('click', () => this.createNewFile());

        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
          e.preventDefault();
          if (e.dataTransfer.files.length > 0) {
            this.importInput.files = e.dataTransfer.files;
            this.handleImport({ target: { files: e.dataTransfer.files } });
          }
        });
      }

      addExamples() {
        vfs.addFile('/index.html', '<h1>Olá, Mundo!</h1>\n<p>Bem-vindo ao SK Mini Editor</p>');
        vfs.addFile('/style.css', 'body {\n  font-family: Arial, sans-serif;\n  background: #f0f0f0;\n}');
        vfs.addFile('/script.js', 'console.log("SK Mini Editor rodando!");');
      }

      selectFile(path) {
        this.currentFile = path;
        const file = vfs.getFile(path);
        if (!file) return;

        this.addTab(path);
        this.codeEditor.value = file.content;
        this.updatePreview();
      }

      updateFile() {
        if (!this.currentFile) return;

        const content = this.codeEditor.value;
        vfs.updateContent(this.currentFile, content);

        clearTimeout(this.previewTimeout);
        this.previewTimeout = setTimeout(() => this.updatePreview(), 500);
      }

      updatePreview() {
        if (!this.currentFile) return;

        const file = vfs.getFile(this.currentFile);
        if (!file) return;

        if (file.type === 'html') {
          this.previewFrame.srcDoc = file.content;
        } else {
          this.previewFrame.srcDoc = `<pre style="padding: 1rem; background: #f0f0f0;">${file.content}</pre>`;
        }
      }

      addTab(path) {
        this.tabs.add(path);
        this.renderTabs();
      }

      renderTabs() {
        this.editorTabs.innerHTML = Array.from(this.tabs).map(path => {
          const file = vfs.getFile(path);
          const isActive = path === this.currentFile;

          return `
            <div class="tab ${isActive ? 'active' : ''}">
              <span style="cursor: pointer;" data-path="${path}">${file.name}</span>
              <button class="tab-close" data-path="${path}">
                <i class="fas fa-times"></i>
              </button>
            </div>
          `;
        }).join('');

        this.editorTabs.querySelectorAll('span').forEach(el => {
          el.addEventListener('click', () => this.selectFile(el.dataset.path));
        });

        this.editorTabs.querySelectorAll('.tab-close').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.tabs.delete(btn.dataset.path);
            if (this.currentFile === btn.dataset.path) {
              this.currentFile = Array.from(this.tabs)[0] || null;
            }
            this.renderTabs();
            if (this.currentFile) this.selectFile(this.currentFile);
          });
        });
      }

      async handleImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const ext = file.name.split('.').pop().toLowerCase();

        try {
          if (ext === 'zip') {
            const zip = new JSZip();
            const loaded = await zip.loadAsync(file);

            for (const [path, zipFile] of Object.entries(loaded.files)) {
              if (!zipFile.dir) {
                const content = await zipFile.async('text');
                vfs.addFile('/' + path, content);
              }
            }
          } else {
            const content = await file.text();
            vfs.addFile('/' + file.name, content);
          }

          this.fileTree.render();
          alert(`✓ ${file.name} importado com sucesso!`);
        } catch (error) {
          alert(`Erro ao importar: ${error.message}`);
        }

        event.target.value = '';
      }

      exportProject() {
        const projectName = this.projectNameInput.value || 'projeto';
        vfs.exportZip(projectName);
      }

      createNewFile() {
        const name = prompt('Nome do arquivo:');
        if (!name) return;

        vfs.addFile('/' + name, '');
        this.fileTree.render();
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // FUNÇÃO DE RESIZE DO PREVIEW
    // ═══════════════════════════════════════════════════════════════

    function resizePreview(delta) {
      const preview = document.getElementById('previewSection');
      const currentHeight = parseInt(preview.style.height) || 300;
      const newHeight = Math.max(150, currentHeight + delta);
      preview.style.height = newHeight + 'px';
    }

    // ═══════════════════════════════════════════════════════════════
    // INICIALIZAR
    // ═══════════════════════════════════════════════════════════════

    let editor;
    document.addEventListener('DOMContentLoaded', () => {
      editor = new Editor();
    });
  </script>
</body>

</html>
