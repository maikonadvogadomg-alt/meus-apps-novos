<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat IA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-2: #172033;
      --editor: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }

    .topbar h1 {
      margin: 0;
      font-size: 16px;
      flex: 1;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--panel-2);
    }

    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .status {
      display: none;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      background: #064e3b;
      color: #a7f3d0;
      flex-shrink: 0;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar h3 {
      margin: 0 0 10px;
      font-size: 12px;
    }

    .sessions-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .session-item {
      padding: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    .session-item:hover {
      border-color: var(--primary);
    }

    .session-item.active {
      background: var(--primary);
      color: white;
    }

    .new-session-btn {
      width: 100%;
      margin-top: 10px;
    }

    .chat-container {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 14px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--panel-2);
      color: var(--text);
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--editor);
      color: var(--text);
      outline: none;
      font-size: 12px;
      resize: none;
      max-height: 100px;
    }

    .chat-input:focus {
      border-color: var(--primary);
    }

    .send-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .token-info {
      font-size: 11px;
      color: var(--muted);
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .main {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 150px;
      }

      .chat-container {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <h1>💬 Chat com IA</h1>
      <div class="btn-group">
        <button id="newSessionBtn" class="primary">+ Nova Conversa</button>
        <button id="deleteSessionBtn">🗑 Deletar</button>
        <button id="exportBtn">💾 Exportar</button>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div class="main">
      <div class="sidebar">
        <h3>Conversas</h3>
        <div id="sessionsList" class="sessions-list"></div>
      </div>

      <div class="chat-container">
        <div class="chat-header">
          <h2 id="sessionTitle">Selecione uma conversa</h2>
        </div>

        <div id="chatMessages" class="chat-messages">
          <div class="empty">Nenhuma conversa selecionada</div>
        </div>

        <div class="token-info">
          <span>Tokens: <span id="tokenCount">0</span> / <span id="tokenLimit">4000</span></span>
          <span style="margin-left: 20px;">Modelo: <span id="modelName">gpt-3.5-turbo</span></span>
        </div>

        <div class="chat-input-area">
          <textarea id="chatInput" class="chat-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
          <button id="sendBtn" class="send-btn">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let supabase = null;
    let currentUser = null;
    let currentSession = null;
    let userConfig = null;
    let tokenCount = 0;
    const MAX_TOKENS = 4000;

    const $ = (id) => document.getElementById(id);

    async function initSupabase() {
      const url = localStorage.getItem("supabase_url");
      const key = localStorage.getItem("supabase_key");

      if (!url || !key) return false;

      supabase = window.supabase.createClient(url, key);

      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;

      if (!currentUser) return false;

      await loadUserConfig();
      await loadSessions();

      return true;
    }

    async function loadUserConfig() {
      if (!supabase || !currentUser) return;

      const { data } = await supabase
        .from("user_configs")
        .select("*")
        .eq("user_id", currentUser.id)
        .single();

      userConfig = data;
    }

    async function loadSessions() {
      if (!supabase || !currentUser) return;

      const { data } = await supabase
        .from("chat_sessions")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      $("sessionsList").innerHTML = "";

      if (!data || data.length === 0) {
        $("sessionsList").innerHTML = '<div style="color: var(--muted); font-size: 11px;">Nenhuma conversa</div>';
        return;
      }

      data.forEach(session => {
        const item = document.createElement("div");
        item.className = "session-item";
        item.textContent = session.title;
        item.addEventListener("click", () => loadSession(session));
        $("sessionsList").appendChild(item);
      });
    }

    async function loadSession(session) {
      currentSession = session;

      document.querySelectorAll(".session-item").forEach(item => {
        item.classList.remove("active");
      });

      event.target.classList.add("active");

      $("sessionTitle").textContent = session.title;
      $("modelName").textContent = session.model;

      const { data: messages } = await supabase
        .from("chat_messages")
        .select("*")
        .eq("session_id", session.id)
        .order("created_at", { ascending: true });

      $("chatMessages").innerHTML = "";

      if (messages && messages.length > 0) {
        messages.forEach(msg => {
          addMessageToUI(msg.role, msg.content);
          tokenCount += msg.tokens_used || 0;
        });
      }

      updateTokenDisplay();
    }

    async function createNewSession() {
      if (!supabase || !currentUser) return;

      const { data, error } = await supabase
        .from("chat_sessions")
        .insert({
          user_id: currentUser.id,
          title: "Conversa " + new Date().toLocaleTimeString(),
          model: "gpt-3.5-turbo",
          temperature: 0.7,
          max_tokens: 2000
        })
        .select()
        .single();

      if (error) {
        showStatus("Erro ao criar conversa", "error");
        return;
      }

      currentSession = data;
      tokenCount = 0;
      await loadSessions();
      await loadSession(data);
      showStatus("Nova conversa criada");
    }

    async function sendMessage() {
      const text = $("chatInput").value.trim();

      if (!text) return;

      if (!currentSession) {
        showStatus("Selecione uma conversa primeiro", "error");
        return;
      }

      if (!userConfig?.openai_key) {
        showStatus("Configure sua chave OpenAI", "error");
        return;
      }

      if (tokenCount >= MAX_TOKENS) {
        showStatus("Limite de tokens atingido", "error");
        return;
      }

      // Adicionar mensagem do usuário
      addMessageToUI("user", text);

      await supabase.from("chat_messages").insert({
        session_id: currentSession.id,
        role: "user",
        content: text,
        tokens_used: Math.ceil(text.length / 4)
      });

      $("chatInput").value = "";

      // Chamar IA
      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${userConfig.openai_key}`
          },
          body: JSON.stringify({
            model: currentSession.model,
            messages: [{ role: "user", content: text }],
            max_tokens: currentSession.max_tokens,
            temperature: currentSession.temperature
          })
        });

        if (!response.ok) {
          throw new Error("Erro na API");
        }

        const data = await response.json();
        const aiMessage = data.choices[0].message.content;
        const tokensUsed = data.usage.completion_tokens;

        addMessageToUI("assistant", aiMessage);

        await supabase.from("chat_messages").insert({
          session_id: currentSession.id,
          role: "assistant",
          content: aiMessage,
          tokens_used: tokensUsed
        });

        // Salvar no Cérebro
        await saveToBrain(text, aiMessage);

        tokenCount += tokensUsed;
        updateTokenDisplay();

      } catch (error) {
        showStatus("Erro: " + error.message, "error");
        addMessageToUI("system", "Erro ao conectar com IA");
      }
    }

    async function saveToBrain(userMessage, aiResponse) {
      if (!supabase || !currentSession) return;

      const { data: brainData } = await supabase
        .from("brain_history")
        .select("iteration")
        .eq("session_id", currentSession.id)
        .order("iteration", { ascending: false })
        .limit(1);

      const nextIteration = (brainData && brainData[0]) ? brainData[0].iteration + 1 : 1;

      await supabase.from("brain_history").insert({
        session_id: currentSession.id,
        iteration: nextIteration,
        context: userMessage,
        code_snippets: aiResponse.includes("```") ? aiResponse : null,
        key_points: aiResponse.substring(0, 500)
      });
    }

    function addMessageToUI(role, content) {
      const container = $("chatMessages");

      if (container.querySelector(".empty")) {
        container.innerHTML = "";
      }

      const msg = document.createElement("div");
      msg.className = "message " + role;
      msg.textContent = content;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function updateTokenDisplay() {
      $("tokenCount").textContent = tokenCount;
    }

    function showStatus(message, type = "success") {
      const el = $("status");
      el.className = "status show " + (type === "error" ? "error" : "");
      el.textContent = message;

      setTimeout(() => {
        el.className = "status";
      }, 3000);
    }

    // Eventos
    $("sendBtn").addEventListener("click", sendMessage);
    $("chatInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    $("newSessionBtn").addEventListener("click", createNewSession);

    $("deleteSessionBtn").addEventListener("click", async () => {
      if (!currentSession || !confirm("Deletar esta conversa?")) return;

      await supabase.from("chat_sessions").delete().eq("id", currentSession.id);
      currentSession = null;
      await loadSessions();
      showStatus("Conversa deletada");
    });

    $("exportBtn").addEventListener("click", async () => {
      if (!currentSession) return;

      const { data: messages } = await supabase
        .from("chat_messages")
        .select("*")
        .eq("session_id", currentSession.id)
        .order("created_at", { ascending: true });

      const json = JSON.stringify(messages, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = currentSession.title + ".json";
      link.click();
      URL.revokeObjectURL(url);
    });

    // Inicializar
    initSupabase().then(success => {
      if (!success) {
        showStatus("Erro ao conectar", "error");
      }
    });
  </script>
</body>

</html>
