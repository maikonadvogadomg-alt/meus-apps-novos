<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat IA Avançado</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="token-manager.js"></script>
  <script src="brain-system.js"></script>

  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-2: #172033;
      --editor: #020617;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #2563eb;
      --success: #059669;
      --warning: #f59e0b;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .topbar h1 {
      margin: 0;
      font-size: 16px;
      flex: 1;
    }

    .model-selector {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--editor);
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--panel-2);
    }

    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    button.danger {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .status {
      display: none;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      flex-shrink: 0;
    }

    .status.show {
      display: flex;
    }

    .status.success {
      background: #064e3b;
      color: #a7f3d0;
    }

    .status.error {
      background: #7f1d1d;
      color: #fecaca;
    }

    .status.warning {
      background: #78350f;
      color: #fcd34d;
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .sidebar {
      width: 220px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar h3 {
      margin: 0 0 10px;
      font-size: 12px;
    }

    .sidebar-section {
      margin-bottom: 15px;
    }

    .sidebar-label {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .token-bar {
      width: 100%;
      height: 6px;
      background: var(--panel-2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .token-fill {
      height: 100%;
      background: var(--success);
      transition: all 0.3s;
    }

    .token-fill.warning {
      background: var(--warning);
    }

    .token-fill.danger {
      background: var(--danger);
    }

    .token-text {
      font-size: 10px;
      color: var(--muted);
    }

    .sessions-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .session-item {
      padding: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    .session-item:hover {
      border-color: var(--primary);
    }

    .session-item.active {
      background: var(--primary);
      color: white;
    }

    .new-session-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
    }

    .chat-container {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 14px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
      background: var(--primary);
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--panel-2);
      color: var(--text);
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-style: italic;
      max-width: 100%;
    }

    .message code {
      background: var(--editor);
      padding: 2px 4px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
    }

    .message pre {
      background: var(--editor);
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 11px;
      margin: 8px 0 0;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--editor);
      color: var(--text);
      outline: none;
      font-size: 12px;
      resize: none;
      max-height: 100px;
    }

    .chat-input:focus {
      border-color: var(--primary);
    }

    .send-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .token-info {
      font-size: 10px;
      color: var(--muted);
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .token-info span {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .main {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 150px;
      }

      .chat-container {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <h1>💬 Chat IA Avançado</h1>

      <select id="modelSelector" class="model-selector">
        <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Gratuito)</option>
        <option value="gpt-4-turbo">GPT-4 Turbo (Pago)</option>
        <option value="gpt-4">GPT-4 (Pago)</option>
        <option value="claude-3-haiku">Claude 3 Haiku (Gratuito)</option>
        <option value="claude-3-sonnet">Claude 3 Sonnet (Pago)</option>
        <option value="claude-3-opus">Claude 3 Opus (Pago)</option>
      </select>

      <div class="btn-group">
        <button id="newSessionBtn" class="primary">+ Nova</button>
        <button id="deleteSessionBtn">🗑 Deletar</button>
        <button id="exportBtn">💾 Exportar</button>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div class="main">
      <div class="sidebar">
        <h3>Conversas</h3>

        <div class="sidebar-section">
          <div class="sidebar-label">Tokens Diários</div>
          <div class="token-bar">
            <div id="tokenFill" class="token-fill" style="width: 0%"></div>
          </div>
          <div class="token-text" id="tokenText">0 / 40000</div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">Modelo</div>
          <div class="token-text" id="modelInfo">GPT-3.5 Turbo</div>
        </div>

        <div class="sessions-list" id="sessionsList"></div>

        <button id="newSessionBtn2" class="new-session-btn primary">+ Nova Conversa</button>
      </div>

      <div class="chat-container">
        <div class="chat-header">
          <h2 id="sessionTitle">Selecione uma conversa</h2>
        </div>

        <div id="chatMessages" class="chat-messages">
          <div class="empty">Nenhuma conversa selecionada</div>
        </div>

        <div class="token-info">
          <span>
            <span id="sessionTokens">0</span> tokens nesta sessão
          </span>
          <span id="costInfo" style="color: var(--warning);">R$ 0,00</span>
        </div>

        <div class="chat-input-area">
          <textarea id="chatInput" class="chat-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
          <button id="sendBtn" class="send-btn">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let supabase = null;
    let currentUser = null;
    let currentSession = null;
    let userConfig = null;
    let tokenManager = new TokenManager();
    let brainSystem = null;

    const $ = (id) => document.getElementById(id);

    async function initSupabase() {
      const url = localStorage.getItem("supabase_url");
      const key = localStorage.getItem("supabase_key");

      if (!url || !key) return false;

      supabase = window.supabase.createClient(url, key);

      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;

      if (!currentUser) return false;

      await loadUserConfig();
      await loadSessions();

      return true;
    }

    async function loadUserConfig() {
      if (!supabase || !currentUser) return;

      const { data } = await supabase
        .from("user_configs")
        .select("*")
        .eq("user_id", currentUser.id)
        .single();

      userConfig = data;
    }

    async function loadSessions() {
      if (!supabase || !currentUser) return;

      const { data } = await supabase
        .from("chat_sessions")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      $("sessionsList").innerHTML = "";

      if (!data || data.length === 0) {
        $("sessionsList").innerHTML = '<div style="color: var(--muted); font-size: 11px;">Nenhuma conversa</div>';
        return;
      }

      data.forEach(session => {
        const item = document.createElement("div");
        item.className = "session-item";
        item.textContent = session.title;
        item.addEventListener("click", () => loadSession(session));
        $("sessionsList").appendChild(item);
      });
    }

    async function loadSession(session) {
      currentSession = session;
      brainSystem = new BrainSystem(supabase, session.id);

      await brainSystem.loadMemories();
      await brainSystem.loadCodeFragments();

      document.querySelectorAll(".session-item").forEach(item => {
        item.classList.remove("active");
      });

      event.target.classList.add("active");

      $("sessionTitle").textContent = session.title;

      const { data: messages } = await supabase
        .from("chat_messages")
        .select("*")
        .eq("session_id", session.id)
        .order("created_at", { ascending: true });

      $("chatMessages").innerHTML = "";

      if (messages && messages.length > 0) {
        messages.forEach(msg => {
          addMessageToUI(msg.role, msg.content);
        });
      }

      updateTokenDisplay();
    }

    async function createNewSession() {
      if (!supabase || !currentUser) return;

      const { data, error } = await supabase
        .from("chat_sessions")
        .insert({
          user_id: currentUser.id,
          title: "Conversa " + new Date().toLocaleTimeString(),
          model: tokenManager.currentModel,
          temperature: 0.7,
          max_tokens: tokenManager.getModelInfo().maxTokensPerRequest
        })
        .select()
        .single();

      if (error) {
        showStatus("Erro ao criar conversa", "error");
        return;
      }

      currentSession = data;
      brainSystem = new BrainSystem(supabase, data.id);
      tokenManager.reset();

      await loadSessions();
      await loadSession(data);
      showStatus("Nova conversa criada");
    }

    async function sendMessage() {
      const text = $("chatInput").value.trim();

      if (!text) return;

      if (!currentSession) {
        showStatus("Selecione uma conversa primeiro", "error");
        return;
      }

      if (!userConfig?.openai_key) {
        showStatus("Configure sua chave OpenAI", "error");
        return;
      }

      // Verificar tokens
      const estimatedTokens = tokenManager.estimateTokens(text);
      const canRequest = tokenManager.canMakeRequest(estimatedTokens);

      if (!canRequest.allowed) {
        showStatus("❌ " + canRequest.reason, "error");
        return;
      }

      // Construir prompt com contexto do cérebro
      let finalPrompt = brainSystem.buildContinuationPrompt(text, tokenManager);
      const model = tokenManager.getModelInfo();
      finalPrompt += brainSystem.buildFragmentationInstructions(model.maxCodeLines);

      // Adicionar mensagem do usuário
      addMessageToUI("user", text);

      await supabase.from("chat_messages").insert({
        session_id: currentSession.id,
        role: "user",
        content: text,
        tokens_used: estimatedTokens
      });

      $("chatInput").value = "";

      // Chamar IA
      try {
        showStatus("⏳ Aguardando resposta...", "");

        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${userConfig.openai_key}`
          },
          body: JSON.stringify({
            model: currentSession.model,
            messages: [{ role: "user", content: finalPrompt }],
            max_tokens: currentSession.max_tokens,
            temperature: currentSession.temperature
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error?.message || "Erro na API");
        }

        const data = await response.json();
        const aiMessage = data.choices[0].message.content;
        const inputTokens = data.usage.prompt_tokens;
        const outputTokens = data.usage.completion_tokens;

        addMessageToUI("assistant", aiMessage);

        // Extrair código
        const codeBlocks = brainSystem.extractCodeBlocks(aiMessage);

        // Salvar mensagem
        await supabase.from("chat_messages").insert({
          session_id: currentSession.id,
          role: "assistant",
          content: aiMessage,
          tokens_used: outputTokens
        });

        // Salvar no cérebro
        await brainSystem.saveMemory(text, aiMessage, codeBlocks);

        // Registrar uso
        const tokenData = tokenManager.addTokens(inputTokens, outputTokens);

        await supabase.from("ai_usage").insert({
          user_id: currentUser.id,
          session_id: currentSession.id,
          model: currentSession.model,
          tokens_input: inputTokens,
          tokens_output: outputTokens,
          tokens_total: tokenData.totalTokens,
          cost: tokenData.cost
        });

        updateTokenDisplay();
        showStatus("✅ Resposta recebida", "success");

      } catch (error) {
        showStatus("❌ Erro: " + error.message, "error");
        addMessageToUI("system", "Erro ao conectar com IA: " + error.message);
      }
    }

    function addMessageToUI(role, content) {
      const container = $("chatMessages");

      if (container.querySelector(".empty")) {
        container.innerHTML = "";
      }

      const msg = document.createElement("div");
      msg.className = "message " + role;

      // Formatar código
      if (role === "assistant") {
        msg.innerHTML = content
          .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
      } else {
        msg.textContent = content;
      }

      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function updateTokenDisplay() {
      const progress = tokenManager.getProgress();

      $("tokenFill").style.width = progress.dailyPercent + "%";
      $("tokenFill").className = "token-fill";

      if (progress.dailyPercent > 80) {
        $("tokenFill").classList.add("danger");
      } else if (progress.dailyPercent > 50) {
        $("tokenFill").classList.add("warning");
      }

      $("tokenText").textContent = `${progress.dailyUsed} / ${progress.dailyMax}`;
      $("modelInfo").textContent = progress.model;
      $("sessionTokens").textContent = progress.sessionUsed;

      // Calcular custo
      const cost = tokenManager.calculateCost(progress.sessionUsed);
      $("costInfo").textContent = "R$ " + (cost * 5.5).toFixed(2); // Conversão USD para BRL
    }

    function showStatus(message, type = "success") {
      const el = $("status");
      el.className = "status show " + type;
      el.textContent = message;

      if (type === "success") {
        setTimeout(() => {
          el.className = "status";
        }, 3000);
      }
    }

    // Eventos
    $("sendBtn").addEventListener("click", sendMessage);
    $("chatInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    $("modelSelector").addEventListener("change", (e) => {
      tokenManager.setModel(e.target.value);
      updateTokenDisplay();
    });

    $("newSessionBtn").addEventListener("click", createNewSession);
    $("newSessionBtn2").addEventListener("click", createNewSession);

    $("deleteSessionBtn").addEventListener("click", async () => {
      if (!currentSession || !confirm("Deletar esta conversa?")) return;

      await supabase.from("chat_sessions").delete().eq("id", currentSession.id);
      currentSession = null;
      await loadSessions();
      showStatus("Conversa deletada");
    });

    $("exportBtn").addEventListener("click", async () => {
      if (!currentSession) return;

      const { data: messages } = await supabase
        .from("chat_messages")
        .select("*")
        .eq("session_id", currentSession.id)
        .order("created_at", { ascending: true });

      const { data: brain } = await supabase
        .from("brain_history")
        .select("*")
        .eq("session_id", currentSession.id)
        .order("iteration", { ascending: true });

      const { data: code } = await supabase
        .from("code_fragments")
        .select("*")
        .eq("session_id", currentSession.id)
        .order("fragment_order", { ascending: true });

      const exportData = {
        session: currentSession,
        messages,
        brain,
        code,
        exportedAt: new Date().toISOString()
      };

      const json = JSON.stringify(exportData, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = currentSession.title + "-completo.json";
      link.click();
      URL.revokeObjectURL(url);

      showStatus("Exportado com sucesso!");
    });

    // Inicializar
    initSupabase().then(success => {
      if (!success) {
        showStatus("Erro ao conectar", "error");
      } else {
        updateTokenDisplay();
      }
    });
  </script>
</body>

</html>
